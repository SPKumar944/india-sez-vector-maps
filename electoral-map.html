<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Bengaluru Electoral Intelligence GIS | Shantinagar AC-160 Dashboard</title>
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data/electoral_data.js"></script>
    <style>
        :root {
            --bg-base: #070b14;
            --bg-surface: #0b1120;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --border-color: #1e293b;
            --border-light: rgba(56, 189, 248, 0.2);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent-blue: #38bdf8;
            --accent-indigo: #818cf8;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            width: 100vw;
            background: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Top Header */
        header {
            height: 64px;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1100;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }

        .brand-badge svg {
            width: 22px;
            height: 22px;
            fill: var(--accent-blue);
        }

        .brand-text h1 {
            font-size: clamp(0.95rem, 0.8rem + 0.5vw, 1.25rem);
            font-weight: 800;
            letter-spacing: 0.2px;
            background: linear-gradient(90deg, #ffffff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            letter-spacing: 0.4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #fff;
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);
        }

        .btn-primary:hover {
            background: #0284c7;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.6);
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--accent-blue);
        }

        /* Main Workspace Layout */
        .workspace-container {
            display: flex;
            flex: 1;
            height: calc(100dvh - 64px);
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* Left Side Control & Metrics Panel */
        #control-panel {
            width: 440px;
            height: 100%;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            container-type: inline-size;
        }

        /* Filter Controls Bar */
        .filter-section {
            padding: 16px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-wrapper {
            position: relative;
        }

        .search-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: var(--text-dim);
        }

        .search-input {
            width: 100%;
            background: #070c18;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px 10px 38px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        .select-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .custom-select {
            background: #070c18;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            color: #e2e8f0;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .custom-select:focus {
            border-color: var(--accent-blue);
        }

        /* Metrics Bar */
        .metrics-grid {
            padding: 14px 16px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 17, 32, 0.95);
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .metric-card-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .metric-card-val {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-top: 3px;
            font-family: var(--font-mono);
        }

        .metric-card-sub {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        /* Panel Navigation Tabs */
        .tab-nav {
            display: flex;
            background: #070c18;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
        }

        .tab-btn {
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* Scrollable Booths Directory */
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .booth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .booth-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-blue);
            transform: translateX(2px);
        }

        .booth-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .booth-part-badge {
            font-size: 11px;
            font-weight: 700;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 2px 7px;
            font-family: var(--font-mono);
        }

        .booth-ward-tag {
            font-size: 10.5px;
            color: var(--accent-indigo);
            font-weight: 600;
        }

        .booth-name {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.35;
            margin-bottom: 6px;
        }

        .booth-stats-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .booth-stats-row span {
            font-weight: 600;
            color: #fff;
            font-family: var(--font-mono);
        }

        .gender-progress {
            height: 5px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            margin-bottom: 6px;
        }

        .gender-progress-male {
            background: #38bdf8;
            height: 100%;
        }

        .gender-progress-female {
            background: #f43f5e;
            height: 100%;
        }

        .booth-streets {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Map Canvas */
        #map-container {
            flex: 1;
            height: 100%;
            position: relative;
            background: #020617;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Floating Map Legend */
        .map-legend {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            font-size: 11px;
            color: var(--text-muted);
        }

        .legend-title {
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .legend-color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: #0f172a !important;
            color: #f1f5f9 !important;
            border: 1px solid #334155 !important;
            border-radius: 12px !important;
            padding: 0 !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7) !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            min-width: 280px;
            max-width: 320px;
        }

        .leaflet-popup-tip {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
        }

        .popup-box {
            padding: 16px;
        }

        .popup-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .popup-title {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .popup-ward {
            font-size: 11px;
            color: var(--accent-blue);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .popup-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .popup-stat-item {
            display: flex;
            flex-direction: column;
        }

        .popup-stat-label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .popup-stat-val {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            font-family: var(--font-mono);
        }

        .popup-section-title {
            font-size: 10.5px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .popup-streets-list {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.35;
            max-height: 80px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-left: 14px;
        }

        .popup-btn {
            display: block;
            text-align: center;
            background: #0284c7;
            color: #fff;
            font-size: 11.5px;
            font-weight: 600;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .popup-btn:hover {
            background: #0369a1;
        }

        /* Marker Pulse Animations */
        .booth-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-weight: 800;
            font-size: 10px;
            font-family: var(--font-mono);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .booth-marker:hover {
            transform: scale(1.25);
            z-index: 9999 !important;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 860px) {
            .workspace-container {
                flex-direction: column-reverse;
            }
            #control-panel {
                width: 100%;
                height: 48%;
                border-right: none;
                border-top: 1px solid var(--border-color);
            }
            #map-container {
                height: 52%;
            }
            .header-actions .btn-secondary {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="header-brand">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>Bengaluru Electoral Roll GIS</h1>
                <p>AC-160 Shantinagar • Special Intensive Revision 2026</p>
            </div>
        </div>

        <div class="header-actions">
            <a href="https://docs.google.com/spreadsheets/d/11IFVlZ0-npAND4NBa_ptw68ZSvRjmouY/edit" target="_blank" rel="noopener" class="btn-link btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/>
                </svg>
                Google Sheet
            </a>
            <a href="data/shantinagar_electoral_geo.json" target="_blank" class="btn-link btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
                GeoJSON API
            </a>
            <a href="index.html" class="btn-link btn-secondary">
                Vector Maps
            </a>
        </div>
    </header>

    <!-- Workspace Container -->
    <div class="workspace-container">
        
        <!-- Left Control & Directory Panel -->
        <aside id="control-panel">
            
            <!-- Filters -->
            <div class="filter-section">
                <div class="search-wrapper">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search booth, school, street (e.g. Richmond, Baldwin, 79)..." />
                </div>

                <div class="select-row">
                    <select id="wardSelect" class="custom-select">
                        <option value="ALL">All Wards (7 Wards)</option>
                    </select>
                    <select id="colorModeSelect" class="custom-select">
                        <option value="ward">Color by Ward</option>
                        <option value="electors">Color by Elector Density</option>
                        <option value="gender">Color by Gender Ratio</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic KPI Metric Summary -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-card-title">Total Electors</div>
                    <div class="metric-card-val" id="kpiTotalElectors">135,159</div>
                    <div class="metric-card-sub" id="kpiGenderBreakdown">68,041 M • 67,118 F</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">Polling Booths</div>
                    <div class="metric-card-val" id="kpiTotalBooths">193</div>
                    <div class="metric-card-sub">Avg 700 electors/booth</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">Gender Ratio</div>
                    <div class="metric-card-val" id="kpiGenderRatio" style="color: #38bdf8;">986</div>
                    <div class="metric-card-sub">Females per 1,000 Males</div>
                </div>
                <div class="metric-card">
                    <div class="metric-card-title">Avg Voter Age</div>
                    <div class="metric-card-val" id="kpiAvgAge" style="color: #10b981;">42.1</div>
                    <div class="metric-card-sub">Years across AC-160</div>
                </div>
            </div>

            <!-- Navigation Tabs -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="booths">Booths List (<span id="visibleBoothsCount">193</span>)</button>
                <button class="tab-btn" data-tab="wards">Ward Breakdown</button>
            </div>

            <!-- Content Area -->
            <div id="boothsList" class="panel-content">
                <!-- Dynamically populated booth cards -->
            </div>

            <div id="wardsList" class="panel-content" style="display: none;">
                <!-- Dynamically populated ward summaries -->
            </div>
        </aside>

        <!-- Right Leaflet Map Canvas -->
        <main id="map-container">
            <div id="map"></div>

            <!-- Floating Legend -->
            <div class="map-legend" id="mapLegend">
                <div class="legend-title" id="legendTitle">BBMP Wards</div>
                <div id="legendItems"></div>
            </div>
        </main>
    </div>

    <script>
        // Initialize State
        const data = window.ELECTORAL_DATA || {};
        const booths = data.booths || [];
        const wards = data.wards || [];
        let filteredBooths = [...booths];

        // Ward Palette
        const WARD_COLORS = {
            111: '#38bdf8', // Shantala Nagar (Sky Blue)
            112: '#10b981', // Domlur (Emerald)
            113: '#f59e0b', // Konena Agrahara (Amber)
            114: '#a855f7', // Agaram / Victoria Layout (Purple)
            115: '#ec4899', // Vannarpet / Viveknagar (Pink)
            116: '#06b6d4', // Nilasandra / Neelasandra (Cyan)
            117: '#f97316'  // Shanthi Nagar (Orange)
        };

        // Initialize Map
        const map = L.map('map', {
            center: [12.9630, 77.6180],
            zoom: 14,
            zoomControl: false
        });

        // Add Zoom Control to Top Right
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Dark Matter Basemap Tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Marker Cluster Layer Group
        const markersGroup = L.layerGroup().addTo(map);
        const markersMap = new Map();

        // Populate Ward Select Dropdown
        const wardSelect = document.getElementById('wardSelect');
        wards.forEach(w => {
            const opt = document.createElement('option');
            opt.value = w.ward_no;
            opt.textContent = `Ward ${w.ward_no} - ${w.ward_name} (${w.booths_count} booths)`;
            wardSelect.appendChild(opt);
        });

        // Determine Marker Color
        function getMarkerColor(booth, mode) {
            if (mode === 'ward') {
                return WARD_COLORS[booth.ward_no] || '#94a3b8';
            } else if (mode === 'electors') {
                const count = booth.total_electors;
                if (count > 950) return '#ef4444'; // Dense (Red)
                if (count > 750) return '#f59e0b'; // Moderate-High (Amber)
                if (count > 550) return '#10b981'; // Normal (Emerald)
                return '#38bdf8'; // Compact (Blue)
            } else if (mode === 'gender') {
                const gr = booth.gender_ratio;
                if (gr >= 1000) return '#ec4899'; // High Female Ratio (Pink)
                if (gr >= 950) return '#818cf8';  // Balanced (Indigo)
                return '#38bdf8';                 // Male Skew (Blue)
            }
            return '#38bdf8';
        }

        // Render Markers on Map
        function renderMapMarkers() {
            markersGroup.clearLayers();
            markersMap.clear();

            const colorMode = document.getElementById('colorModeSelect').value;

            filteredBooths.forEach(b => {
                const color = getMarkerColor(b, colorMode);
                const size = Math.min(Math.max(b.total_electors / 35, 24), 40);

                const icon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="booth-marker" style="background: ${color}; width: ${size}px; height: ${size}px;">${b.part_no}</div>`,
                    iconSize: [size, size],
                    iconAnchor: [size / 2, size / 2]
                });

                const marker = L.marker([b.lat, b.lng], { icon: icon });

                // Popup HTML
                const streetsHtml = b.sections.map(s => `<li>${s}</li>`).join('');
                const malePct = Math.round((b.male / b.total_electors) * 100);
                const femalePct = 100 - malePct;

                const popupContent = `
                    <div class="popup-box">
                        <div class="popup-header">
                            <span class="booth-part-badge">Part #${b.part_no}</span>
                            <span style="font-size: 11px; font-weight: 700; color: ${color};">Ward ${b.ward_no}</span>
                        </div>
                        <div class="popup-title">${b.booth_name}</div>
                        <div class="popup-ward">${b.ward_name} Locality</div>

                        <div class="popup-stats-grid">
                            <div class="popup-stat-item">
                                <span class="popup-stat-label">Total Electors</span>
                                <span class="popup-stat-val">${b.total_electors.toLocaleString()}</span>
                            </div>
                            <div class="popup-stat-item">
                                <span class="popup-stat-label">Gender Ratio</span>
                                <span class="popup-stat-val">${b.gender_ratio}</span>
                            </div>
                            <div class="popup-stat-item">
                                <span class="popup-stat-label">Male / Female</span>
                                <span class="popup-stat-val">${b.male} / ${b.female}</span>
                            </div>
                            <div class="popup-stat-item">
                                <span class="popup-stat-label">Avg Age</span>
                                <span class="popup-stat-val">${b.avg_age} yrs</span>
                            </div>
                        </div>

                        <div style="margin-bottom: 10px;">
                            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 3px;">
                                <span>Male: ${malePct}%</span>
                                <span>Female: ${femalePct}%</span>
                            </div>
                            <div class="gender-progress">
                                <div class="gender-progress-male" style="width: ${malePct}%;"></div>
                                <div class="gender-progress-female" style="width: ${femalePct}%;"></div>
                            </div>
                        </div>

                        <div class="popup-section-title">Catchment Streets & Localities:</div>
                        <ul class="popup-streets-list">${streetsHtml}</ul>

                        <a href="https://docs.google.com/spreadsheets/d/11IFVlZ0-npAND4NBa_ptw68ZSvRjmouY/edit" target="_blank" class="popup-btn">
                            View Part #${b.part_no} in Google Sheet
                        </a>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);
                markersMap.set(b.part_no, marker);
            });

            updateLegend(colorMode);
        }

        // Render Sidebar Booth Cards
        function renderBoothsList() {
            const listEl = document.getElementById('boothsList');
            listEl.innerHTML = '';

            document.getElementById('visibleBoothsCount').textContent = filteredBooths.length;

            if (filteredBooths.length === 0) {
                listEl.innerHTML = `<div style="text-align: center; color: var(--text-dim); padding: 40px 10px;">No polling booths match your search criteria.</div>`;
                return;
            }

            filteredBooths.forEach(b => {
                const card = document.createElement('div');
                card.className = 'booth-card';
                card.setAttribute('data-part', b.part_no);

                const malePct = Math.round((b.male / b.total_electors) * 100);
                const femalePct = 100 - malePct;
                const streetsStr = b.sections.slice(0, 3).join(', ');

                card.innerHTML = `
                    <div class="booth-card-header">
                        <span class="booth-part-badge">Part #${b.part_no}</span>
                        <span class="booth-ward-tag">Ward ${b.ward_no} • ${b.ward_name}</span>
                    </div>
                    <div class="booth-name">${b.booth_name}</div>
                    <div class="booth-stats-row">
                        <div>Voters: <span>${b.total_electors.toLocaleString()}</span></div>
                        <div>Ratio: <span>${b.gender_ratio}</span></div>
                        <div>Age: <span>${b.avg_age}</span></div>
                    </div>
                    <div class="gender-progress">
                        <div class="gender-progress-male" style="width: ${malePct}%;"></div>
                        <div class="gender-progress-female" style="width: ${femalePct}%;"></div>
                    </div>
                    <div class="booth-streets" title="${b.sections.join('; ')}">📍 ${streetsStr}</div>
                `;

                card.addEventListener('click', () => {
                    const marker = markersMap.get(b.part_no);
                    if (marker) {
                        map.flyTo([b.lat, b.lng], 16, { duration: 1.2 });
                        marker.openPopup();
                    }
                });

                listEl.appendChild(card);
            });
        }

        // Render Ward Breakdown Tab
        function renderWardsList() {
            const listEl = document.getElementById('wardsList');
            listEl.innerHTML = '';

            wards.forEach(w => {
                const card = document.createElement('div');
                card.className = 'booth-card';
                const color = WARD_COLORS[w.ward_no] || '#38bdf8';

                const wardGr = Math.round((w.female / w.male) * 1000);

                card.innerHTML = `
                    <div class="booth-card-header">
                        <span class="booth-part-badge" style="background: ${color}20; color: ${color}; border-color: ${color}60;">Ward ${w.ward_no}</span>
                        <span style="font-size: 11px; font-weight: 700; color: #fff;">${w.booths_count} Booths</span>
                    </div>
                    <div class="booth-name" style="font-size: 14px;">${w.ward_name}</div>
                    <div class="booth-stats-row" style="margin-top: 8px;">
                        <div>Total Electors: <span>${w.total_electors.toLocaleString()}</span></div>
                        <div>Ratio: <span>${wardGr}</span></div>
                    </div>
                    <div class="booth-stats-row" style="font-size: 10.5px; color: var(--text-dim);">
                        <div>Males: <span>${w.male.toLocaleString()}</span></div>
                        <div>Females: <span>${w.female.toLocaleString()}</span></div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    document.getElementById('wardSelect').value = w.ward_no;
                    filterData();
                    // Switch to booths tab
                    document.querySelectorAll('.tab-btn')[0].click();
                });

                listEl.appendChild(card);
            });
        }

        // Update Legend
        function updateLegend(mode) {
            const legendEl = document.getElementById('legendItems');
            const titleEl = document.getElementById('legendTitle');
            legendEl.innerHTML = '';

            if (mode === 'ward') {
                titleEl.textContent = 'BBMP Wards';
                wards.forEach(w => {
                    const color = WARD_COLORS[w.ward_no] || '#94a3b8';
                    legendEl.innerHTML += `
                        <div class="legend-item">
                            <span class="legend-color-dot" style="background: ${color};"></span>
                            <span>Ward ${w.ward_no} (${w.ward_name})</span>
                        </div>
                    `;
                });
            } else if (mode === 'electors') {
                titleEl.textContent = 'Elector Density';
                legendEl.innerHTML = `
                    <div class="legend-item"><span class="legend-color-dot" style="background: #ef4444;"></span><span>&gt; 950 Voters</span></div>
                    <div class="legend-item"><span class="legend-color-dot" style="background: #f59e0b;"></span><span>750 - 950 Voters</span></div>
                    <div class="legend-item"><span class="legend-color-dot" style="background: #10b981;"></span><span>550 - 750 Voters</span></div>
                    <div class="legend-item"><span class="legend-color-dot" style="background: #38bdf8;"></span><span>&lt; 550 Voters</span></div>
                `;
            } else if (mode === 'gender') {
                titleEl.textContent = 'Gender Ratio (F/1000M)';
                legendEl.innerHTML = `
                    <div class="legend-item"><span class="legend-color-dot" style="background: #ec4899;"></span><span>&ge; 1,000 (Female Skew)</span></div>
                    <div class="legend-item"><span class="legend-color-dot" style="background: #818cf8;"></span><span>950 - 999 (Balanced)</span></div>
                    <div class="legend-item"><span class="legend-color-dot" style="background: #38bdf8;"></span><span>&lt; 950 (Male Skew)</span></div>
                `;
            }
        }

        // Filter Function
        function filterData() {
            const selectedWard = document.getElementById('wardSelect').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            filteredBooths = booths.filter(b => {
                const matchesWard = (selectedWard === 'ALL') || (String(b.ward_no) === String(selectedWard));
                
                const matchesSearch = !searchTerm || 
                    String(b.part_no).includes(searchTerm) ||
                    b.booth_name.toLowerCase().includes(searchTerm) ||
                    b.ward_name.toLowerCase().includes(searchTerm) ||
                    b.sections.some(s => s.toLowerCase().includes(searchTerm));

                return matchesWard && matchesSearch;
            });

            // Update Dynamic KPIs
            const totElectors = filteredBooths.reduce((acc, b) => acc + b.total_electors, 0);
            const totMale = filteredBooths.reduce((acc, b) => acc + b.male, 0);
            const totFemale = filteredBooths.reduce((acc, b) => acc + b.female, 0);
            const gr = totMale > 0 ? Math.round((totFemale / totMale) * 1000) : 0;
            const avgAge = filteredBooths.length > 0 ? (filteredBooths.reduce((acc, b) => acc + b.avg_age, 0) / filteredBooths.length).toFixed(1) : 0;

            document.getElementById('kpiTotalElectors').textContent = totElectors.toLocaleString();
            document.getElementById('kpiTotalBooths').textContent = filteredBooths.length;
            document.getElementById('kpiGenderRatio').textContent = gr;
            document.getElementById('kpiAvgAge').textContent = avgAge;
            document.getElementById('kpiGenderBreakdown').textContent = `${totMale.toLocaleString()} M • ${totFemale.toLocaleString()} F`;

            renderMapMarkers();
            renderBoothsList();

            // Auto-fit bounds if filtered
            if (filteredBooths.length > 0 && selectedWard !== 'ALL') {
                const bounds = L.latLngBounds(filteredBooths.map(b => [b.lat, b.lng]));
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('wardSelect').addEventListener('change', filterData);
        document.getElementById('colorModeSelect').addEventListener('change', renderMapMarkers);

        // Tab Navigation Listeners
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tab = btn.getAttribute('data-tab');
                if (tab === 'booths') {
                    document.getElementById('boothsList').style.display = 'block';
                    document.getElementById('wardsList').style.display = 'none';
                } else {
                    document.getElementById('boothsList').style.display = 'none';
                    document.getElementById('wardsList').style.display = 'block';
                }
            });
        });

        // Initial Render
        renderMapMarkers();
        renderBoothsList();
        renderWardsList();
    </script>
</body>
</html>
